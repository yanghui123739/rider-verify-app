<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI社区通行核验</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(180deg, #e8f5e9 0%, #f1f8e9 100%); min-height: 100vh; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; }
        .container { background: #fff; border-radius: 20px; box-shadow: 0 8px 32px rgba(76, 175, 80, 0.15); padding: 32px 24px; width: 100%; max-width: 400px; }
        .header { text-align: center; margin-bottom: 28px; }
        .header .logo { width: 64px; height: 64px; background: #4CAF50; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 32px; color: #fff; margin-bottom: 12px; }
        .header h1 { font-size: 22px; color: #2e7d32; margin: 0 0 6px; }
        .header p { font-size: 13px; color: #81c784; margin: 0; }
        .upload-area { border: 2px dashed #a5d6a7; border-radius: 12px; padding: 32px 16px; text-align: center; cursor: pointer; transition: all 0.3s; margin-bottom: 20px; background: #f9fbe7; }
        .upload-area:hover { border-color: #4CAF50; background: #f1f8e9; }
        .upload-area .icon { font-size: 40px; color: #a5d6a7; margin-bottom: 8px; }
        .upload-area p { color: #81c784; font-size: 14px; margin: 0; }
        .preview { display: none; text-align: center; margin-bottom: 16px; }
        .preview img { max-width: 100%; max-height: 240px; border-radius: 8px; border: 1px solid #e0e0e0; }
        .preview .filename { font-size: 12px; color: #9e9e9e; margin-top: 6px; word-break: break-all; }
        .btn { width: 100%; padding: 14px; background: #4CAF50; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .btn:hover { background: #43a047; }
        .btn:disabled { background: #c8e6c9; cursor: not-allowed; }
        .result { margin-top: 20px; padding: 16px; border-radius: 12px; display: none; }
        .result.success { background: #e8f5e9; border: 1px solid #a5d6a7; }
        .result.fail { background: #ffebee; border: 1px solid #ef9a9a; }
        .result .title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
        .result .title.success { color: #2e7d32; }
        .result .title.fail { color: #c62828; }
        .result .field { font-size: 13px; color: #555; margin: 4px 0; }
        .loading { display: none; text-align: center; padding: 16px; color: #4CAF50; font-size: 14px; }
        .loading .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #a5d6a7; border-top-color: #4CAF50; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🛡️</div>
            <h1>AI社区通行核验</h1>
            <p>上传外卖订单截图，自动核验配送信息</p>
        </div>

        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <div class="icon">📷</div>
            <p>点击上传订单截图</p>
            <p style="font-size:12px; color:#bdbdbd;">支持拍照或从相册选择</p>
        </div>
        <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">

        <div class="preview" id="preview">
            <img id="previewImg" src="" alt="预览">
            <div class="filename" id="filename"></div>
            <a href="#" onclick="resetUpload(); return false;" style="font-size:13px; color:#4CAF50; margin-top:6px; display:inline-block;">重新选择图片</a>
        </div>

        <button class="btn" id="verifyBtn" onclick="verifyOrder()" disabled>开始核验</button>

        <div class="loading" id="loading">
            <span class="spinner"></span> 核验中...
        </div>

        <div class="result" id="result">
            <div class="title" id="resultTitle"></div>
            <div id="resultFields"></div>
        </div>
    </div>

    <script>
        let selectedFile = null;

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('previewImg').src = e.target.result;
                document.getElementById('filename').textContent = file.name;
                document.getElementById('preview').style.display = 'block';
                document.getElementById('verifyBtn').disabled = false;
                document.getElementById('result').style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        function resetUpload() {
            selectedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('preview').style.display = 'none';
            document.getElementById('verifyBtn').disabled = true;
            document.getElementById('result').style.display = 'none';
        }

        async function verifyOrder() {
            if (!selectedFile) return;

            const btn = document.getElementById('verifyBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');

            btn.disabled = true;
            loading.style.display = 'block';
            result.style.display = 'none';

            try {
                // 将图片转为 base64
                const base64 = await fileToBase64(selectedFile);

                // 调用我们自己的 Vercel 代理接口
                const response = await fetch('/api/proxy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image_data: base64 })
                });

                const data = await response.json();

                // 处理结果
                loading.style.display = 'none';
                result.style.display = 'block';

                if (data.verify_result === '核验通过') {
                    result.className = 'result success';
                    document.getElementById('resultTitle').className = 'title success';
                    document.getElementById('resultTitle').textContent = '✅ 核验通过';
                    document.getElementById('resultFields').innerHTML = `
                        <div class="field">🏠 小区：${data.community_name || '-'}</div>
                        <div class="field">🏢 楼栋：${data.building_number || '-'}</div>
                        <div class="field">⏰ 时间：${data.order_time || '-'}</div>
                        <div class="field">📋 订单号：${data.order_id || '-'}</div>
                        <div class="field">👤 骑手：${data.rider_name || '-'}</div>
                        <div class="field">📱 平台：${data.platform || '-'}</div>
                        <div class="field">📊 状态：${data.order_status || '-'}</div>
                    `;
                } else {
                    result.className = 'result fail';
                    document.getElementById('resultTitle').className = 'title fail';
                    document.getElementById('resultTitle').textContent = '❌ 核验失败';
                    document.getElementById('resultFields').innerHTML = `<div class="field">${data.verify_result || '核验失败，未处于配送中状态或图片无效'}</div>`;
                }
            } catch (err) {
                loading.style.display = 'none';
                result.style.display = 'block';
                result.className = 'result fail';
                document.getElementById('resultTitle').className = 'title fail';
                document.getElementById('resultTitle').textContent = '⚠️ 网络异常，请检查网络后重试';
                document.getElementById('resultFields').innerHTML = '';
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
